server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: restaurant-qr-backend

  # ─── MySQL ───────────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/restaurant_qr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      pool-name: RestaurantQRPool

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update          # Use 'validate' in production after first run
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ─── Mail ─────────────────────────────────────────────────────────────────────
  # SECURITY: these were committed in plaintext in the original repo. Treat the
  # Gmail app password below as compromised — rotate it in your Google Account
  # security settings and then override it via the MAIL_PASSWORD env var (or any
  # other SMTP provider) instead of editing this file again.
  mail:
    host: smtp.gmail.com
    port: 587
    username: 
    password: 
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ─── Cache ────────────────────────────────────────────────────────────────────
  cache:
    type: simple

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:7A25432A462D4A614E645267556B58703273357638792F423F4528482B4D6251}
  access-token-expiration: 86400000      # 1 day (ms)
  refresh-token-expiration: 604800000    # 7 days (ms)

# ─── Cloudinary ───────────────────────────────────────────────────────────────
# SECURITY: same as above — this API secret was committed in plaintext. Rotate it
# in your Cloudinary dashboard and override via CLOUDINARY_API_SECRET going forward.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:158833248977724}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: restaurant-qr

# ─── QR Code ──────────────────────────────────────────────────────────────────
qr:
  base-url: ${QR_BASE_URL:${app.frontend-url:http://localhost:4200}/menu}
  image-width: 300
  image-height: 300

# ─── App ──────────────────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  admin-url: ${ADMIN_URL:http://localhost:4201}

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.restaurantqr: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
